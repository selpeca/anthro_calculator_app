name: anthro_calculator_app
description: "Anthro Calculator App — offline-first pediatric anthropometry (OMS / Colombia)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.2
  path_provider: ^2.1.4
  crypto: ^3.0.3
  sqflite: ^2.4.3
  path: ^1.9.1
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_light.png
    - assets/icon_dark.png
    - assets/reference/
    - assets/reference/oms-2006/
    - assets/reference/oms-2006/tables/
    - assets/reference/col-2465/
    - assets/fonts/

flutter_launcher_icons:
  image_path: "assets/icon_light.png"
  android: true
  ios: true
  adaptive_icon_background: "#F5F4EF"
  adaptive_icon_foreground: "assets/icon_light.png"

flutter_native_splash:
  color: "F5F4EF"
  color_dark: "0E1620"
  image: "assets/icon_light.png"
  image_dark: "assets/icon_dark.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "F5F4EF"
    color_dark: "0E1620"
    image: "assets/icon_light.png"
    image_dark: "assets/icon_dark.png"
